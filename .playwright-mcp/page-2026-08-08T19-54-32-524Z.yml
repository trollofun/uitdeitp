        - paragraph [ref=f15e15]: "SoftITP Flow respectă principiile GDPR: legalitate, echitate, transparență, minimizarea datelor, exactitate, limitarea stocării și integritatea/confidențialitatea. Toate fluxurile din aplicație sunt concepute pentru a colecta doar informațiile necesare procesului de programare și raportare ITP."
      - generic [ref=f15e16]:
        - heading "Roluri și responsabilități" [level=2] [ref=f15e17]
        - paragraph [ref=f15e18]: Stația ITP care folosește SoftITP Flow rămâne operatorul de date. ALVERNA IMOBILIARE SRL acționează ca împuternicit și prelucrează datele doar pentru a furniza serviciile SaaS contractate. Orice cerință suplimentară (ex. exporturi speciale, audit) se execută numai în baza instrucțiunilor scrise ale operatorului.
      - generic [ref=f15e19]:
        - heading "Categorii de date și operațiuni" [level=2] [ref=f15e20]
        - paragraph [ref=f15e21]: "Operațiunile principale sunt: colectarea prin formulare, stocarea în baze de date găzduite în UE, transmiterea notificărilor (SMS, email, WhatsApp), generarea de rapoarte și exporturi către operator."
        - list [ref=f15e22]:
          - listitem [ref=f15e23]: Date de identificare și contact ale clienților finali (nume, telefon, email).
          - listitem [ref=f15e24]: Date despre vehicule și programări ITP.
          - listitem [ref=f15e25]: Date contabile minime pentru emiterea facturilor către stații.
          - listitem [ref=f15e26]: Loguri tehnice necesare securității platformei.
      - generic [ref=f15e27]:
        - heading "Măsuri tehnice și organizaționale" [level=2] [ref=f15e28]
        - list [ref=f15e29]:
          - listitem [ref=f15e30]: Infrastructură găzduită pe servere cu certificări ISO 27001 și backup zilnic criptat.
          - listitem [ref=f15e31]: Control al accesului bazat pe roluri și autentificare multi-factor pentru personalul intern.
          - listitem [ref=f15e32]: Jurnalizare a acțiunilor critice și mecanisme automate de alertă la comportament anormal.
          - listitem [ref=f15e33]: Criptarea datelor în tranzit (HTTPS/TLS 1.2+) și la rest pentru câmpurile sensibile.
          - listitem [ref=f15e34]: Proceduri de răspuns la incidente și testări periodice de securitate.
      - generic [ref=f15e35]:
        - heading "Subîmputerniciți" [level=2] [ref=f15e36]
        - paragraph [ref=f15e37]: Pentru a furniza serviciile folosim furnizori specializați (Vercel, Netopia, furnizori SMS/email). Fiecare partener are clauze contractuale GDPR și prelucrează datele exclusiv pentru scopul necesar. Lista completă a subîmputerniciților este disponibilă la cerere prin email la privacy@softitp.ro.
      - generic [ref=f15e38]:
        - heading "Drepturile persoanelor vizate" [level=2] [ref=f15e39]
        - paragraph [ref=f15e40]: Orice persoană fizică poate solicita acces, rectificare, ștergere, restricționare sau portabilitatea datelor. Solicitările se transmit operatorului (stației ITP) sau direct către noi, iar răspunsul se oferă în maximum 30 de zile. Pentru marketing, consimțământul poate fi retras dintr-un singur click în mesajele trimise.
      - generic [ref=f15e41]:
        - heading "Contact și notificări de incident" [level=2] [ref=f15e42]
        - paragraph [ref=f15e43]: "Incidentelor de securitate le este aplicat un protocol intern: identificare, izolare, remediere și notificarea operatorilor afectați în cel mult 24h de la confirmare. Pentru orice întrebare privind protecția datelor scrie la privacy@softitp.ro sau contactează responsabilul desemnat la +40 745 223 355."
      - paragraph [ref=f15e45]: Dacă nu ești mulțumit de răspunsul primit, poți depune o plângere la Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal (www.dataprotection.ro). Totuși, te încurajăm să iei legătura cu noi pentru a soluționa rapid orice situație.
